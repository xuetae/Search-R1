# === 中文逐行注释辅助：本文件已按复现学习用途补充中文注释，原始配置/脚本逻辑保持不变。===
# 中文注释：下一行是 YAML 配置项，用于控制训练、模型、数据或运行参数。
trainer:
  # 中文注释：下一行是 YAML 配置项，用于控制训练、模型、数据或运行参数。
  nnodes: 1
  # 中文注释：下一行是 YAML 配置项，用于控制训练、模型、数据或运行参数。
  n_gpus_per_node: 8

# 中文注释：下一行是 YAML 配置项，用于控制训练、模型、数据或运行参数。
data:
  # 中文注释：下一行是 YAML 配置项，用于控制训练、模型、数据或运行参数。
  path: ~/data/rlhf/math/test.parquet
  # 中文注释：下一行是 YAML 配置项，用于控制训练、模型、数据或运行参数。
  prompt_key: prompt
  # 中文注释：下一行是 YAML 配置项，用于控制训练、模型、数据或运行参数。
  n_samples: 5
  # 中文注释：下一行是 YAML 配置项，用于控制训练、模型、数据或运行参数。
  output_path: /opt/tiger/math_Qwen2-7B-Instruct.parquet
  # 中文注释：下一行是 YAML 配置项，用于控制训练、模型、数据或运行参数。
  batch_size: 128

# 中文注释：下一行是 YAML 配置项，用于控制训练、模型、数据或运行参数。
model:
  # 中文注释：下一行是 YAML 配置项，用于控制训练、模型、数据或运行参数。
  path: ~/models/Qwen2-7B-Instruct
  # 中文注释：下一行是 YAML 配置项，用于控制训练、模型、数据或运行参数。
  external_lib: null
# 中文注释：下一行是 YAML 配置项，用于控制训练、模型、数据或运行参数。
rollout:
  # 中文注释：下一行是 YAML 配置项，用于控制训练、模型、数据或运行参数。
  name: vllm
  # 中文注释：下一行是 YAML 配置项，用于控制训练、模型、数据或运行参数。
  temperature: 1.0
  # 中文注释：下一行是 YAML 配置项，用于控制训练、模型、数据或运行参数。
  top_k: 50 # 0 for hf rollout, -1 for vllm rollout
  # 中文注释：下一行是 YAML 配置项，用于控制训练、模型、数据或运行参数。
  top_p: 0.7
  # 中文注释：下一行是 YAML 配置项，用于控制训练、模型、数据或运行参数。
  prompt_length: 1536
  # 中文注释：下一行是 YAML 配置项，用于控制训练、模型、数据或运行参数。
  response_length: 512
  # for vllm rollout
  # 中文注释：下一行是 YAML 配置项，用于控制训练、模型、数据或运行参数。
  dtype: bfloat16 # should align with FSDP
  # 中文注释：下一行是 YAML 配置项，用于控制训练、模型、数据或运行参数。
  gpu_memory_utilization: 0.5
  # 中文注释：下一行是 YAML 配置项，用于控制训练、模型、数据或运行参数。
  ignore_eos: False
  # 中文注释：下一行是 YAML 配置项，用于控制训练、模型、数据或运行参数。
  micro_batch_size: 256
  # 中文注释：下一行是 YAML 配置项，用于控制训练、模型、数据或运行参数。
  enforce_eager: True
  # 中文注释：下一行是 YAML 配置项，用于控制训练、模型、数据或运行参数。
  free_cache_engine: True
  # 中文注释：下一行是 YAML 配置项，用于控制训练、模型、数据或运行参数。
  load_format: dummy_dtensor
  # 中文注释：下一行是 YAML 配置项，用于控制训练、模型、数据或运行参数。
  tensor_model_parallel_size: 1
  # 中文注释：下一行是 YAML 配置项，用于控制训练、模型、数据或运行参数。
  max_num_batched_tokens: 8192
  # 中文注释：下一行是 YAML 配置项，用于控制训练、模型、数据或运行参数。
  max_num_seqs: 1024
  # 中文注释：下一行是 YAML 配置项，用于控制训练、模型、数据或运行参数。
  log_prob_micro_batch_size: 8
  # for hf rollout
  # 中文注释：下一行是 YAML 配置项，用于控制训练、模型、数据或运行参数。  do_sample: True